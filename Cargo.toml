[package]
name = "proton-mail-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
imap = { version = "2.4.1", features = ["native-tls"] }
native-tls = "0.2.18"
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version="1.49.0", features = ["rt", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
