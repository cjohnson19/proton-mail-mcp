[package]
name = "proton-mail-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
html2text = "0.16"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
mail-builder = "0.4"
mailparse = "0.15"
native-tls = "0.2.18"
axum = "0.8"
rmcp = { version = "3.3.0", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
] }
schemars = "1.2.1"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "net", "macros", "fs"] }
tokio-native-tls = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["rust_crypto"] }
sha2 = "0.11.0"
rand = "0.10.2"
subtle = "2.6.1"
serde_urlencoded = "0.7.1"
pdf-extract = "0.12"

[dev-dependencies]
http-body-util = "0.1.3"
imap-proto = "0.16"
tokio = { version = "1.49.0", features = ["test-util", "macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
