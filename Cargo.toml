[package]
name = "proton-mail-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22"
html2text = "0.16"
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
mailparse = "0.15"
native-tls = "0.2.18"
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
schemars = "1.2.1"
serde = "1.0.228"
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt", "rt-multi-thread", "net"] }
tokio-native-tls = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
